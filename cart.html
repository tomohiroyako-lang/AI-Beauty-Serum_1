<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>カート | LUMIÈRE</title>

  <!-- dataLayer 初期化 -->
  <script>
    window.dataLayer = window.dataLayer || [];
  </script>

  <!-- Google Tag Manager をここに設置 -->
  <!-- GTM head snippet ↓ -->
  <!-- <script>(function(w,d,s,l,i){...})</script> -->

  <style>
    :root {
      --cream: #fdf8f4;
      --blush: #f2d9d0;
      --rose: #c9796a;
      --rose-dark: #a85f52;
      --taupe: #8a7570;
      --text: #3a2e2b;
      --text-light: #7a6e6b;
      --border: #ecddd8;
      --white: #ffffff;
      --shadow: 0 4px 24px rgba(180,120,100,0.10);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--cream);
      font-family: 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif;
      color: var(--text);
      min-height: 100vh;
    }

    header {
      background: var(--white);
      border-bottom: 1px solid var(--border);
      padding: 18px 24px;
      text-align: center;
    }
    .logo { font-size: 22px; letter-spacing: 0.18em; color: var(--rose); font-weight: 300; }
    .logo span { font-weight: 700; }

    /* Breadcrumb */
    .breadcrumb {
      max-width: 480px;
      margin: 20px auto 0;
      padding: 0 20px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--text-light);
    }
    .breadcrumb .step { padding: 4px 12px; border-radius: 20px; background: var(--border); }
    .breadcrumb .step.active { background: var(--rose); color: #fff; font-weight: 700; }
    .breadcrumb .arrow { color: var(--border); }

    main {
      max-width: 480px;
      margin: 24px auto;
      padding: 0 20px 60px;
    }

    h2 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 20px;
      letter-spacing: 0.04em;
    }

    /* Cart Item Card */
    .cart-card {
      background: var(--white);
      border-radius: 16px;
      box-shadow: var(--shadow);
      padding: 20px;
      margin-bottom: 16px;
    }

    .cart-item {
      display: flex;
      gap: 16px;
      align-items: flex-start;
    }

    /* Mini product image */
    .item-thumb {
      width: 72px;
      height: 90px;
      background: linear-gradient(145deg, #f7ebe6 0%, #edd5cc 100%);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      overflow: hidden;
    }

    .item-details {
      flex: 1;
    }
    .item-name {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .item-sub {
      font-size: 12px;
      color: var(--text-light);
      margin-bottom: 12px;
    }
    .item-qty-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .qty-control {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--cream);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 4px 10px;
    }
    .qty-control span {
      font-size: 14px;
      font-weight: 700;
      min-width: 18px;
      text-align: center;
    }
    .qty-control button {
      background: none;
      border: none;
      cursor: default;
      color: var(--text-light);
      font-size: 16px;
      padding: 0 2px;
    }
    .item-price {
      font-size: 16px;
      font-weight: 800;
      color: var(--rose);
    }

    /* Summary Card */
    .summary-card {
      background: var(--white);
      border-radius: 16px;
      box-shadow: var(--shadow);
      padding: 22px 20px;
      margin-bottom: 16px;
    }
    .summary-title {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 14px;
      color: var(--taupe);
      letter-spacing: 0.06em;
    }
    .summary-row {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      margin-bottom: 10px;
      color: var(--text-light);
    }
    .summary-row.total {
      font-size: 17px;
      font-weight: 800;
      color: var(--text);
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
    }
    .summary-row.total .total-price { color: var(--rose); }

    /* Checkout button */
    .btn-checkout {
      display: block;
      width: 100%;
      padding: 16px;
      background: var(--rose);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.08em;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      text-align: center;
    }
    .btn-checkout:hover { background: var(--rose-dark); }
    .btn-checkout:active { transform: scale(0.98); }

    .btn-back {
      display: block;
      width: 100%;
      padding: 12px;
      background: transparent;
      color: var(--text-light);
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: 14px;
      cursor: pointer;
      margin-top: 10px;
      text-align: center;
      transition: background 0.2s;
    }
    .btn-back:hover { background: var(--blush); }

    /* Security note */
    .security-note {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text-light);
      margin-top: 14px;
    }

    footer {
      text-align: center;
      padding: 24px;
      font-size: 12px;
      color: var(--text-light);
    }
  </style>
</head>
<body>

  <!-- Google Tag Manager (noscript) をここに設置 -->
  <!-- <noscript>...</noscript> -->

  <header>
    <div class="logo">LUMI<span>ÈRE</span></div>
  </header>

  <!-- ステップナビ -->
  <div class="breadcrumb">
    <span class="step">商品</span>
    <span class="arrow">›</span>
    <span class="step active">カート</span>
    <span class="arrow">›</span>
    <span class="step">お支払い</span>
    <span class="arrow">›</span>
    <span class="step">完了</span>
  </div>

  <main>
    <h2>🛒 カートの中身</h2>

    <!-- カートアイテム -->
    <div class="cart-card">
      <div class="cart-item">
        <!-- ミニ商品画像 -->
        <div class="item-thumb">
          <svg viewBox="0 0 72 90" width="72" height="90" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="28" y="4" width="16" height="8" rx="3" fill="#c9796a"/>
            <rect x="30" y="12" width="12" height="8" rx="2" fill="#e8bfb8"/>
            <rect x="10" y="20" width="52" height="64" rx="12" fill="white" stroke="#ecddd8" stroke-width="1.2"/>
            <rect x="11" y="44" width="50" height="40" rx="0" fill="#f2d9d0" opacity="0.5"/>
            <rect x="18" y="26" width="36" height="42" rx="6" fill="#fdf0ed"/>
            <rect x="24" y="34" width="24" height="3" rx="2" fill="#c9796a" opacity="0.6"/>
            <rect x="22" y="41" width="28" height="2.5" rx="2" fill="#d0a09a" opacity="0.4"/>
            <circle cx="36" cy="57" r="8" fill="#f2d9d0"/>
            <text x="36" y="61" text-anchor="middle" font-size="8" fill="#c9796a" font-family="Georgia,serif" font-style="italic">L</text>
          </svg>
        </div>

        <div class="item-details">
          <p class="item-name">AI Beauty Serum</p>
          <p class="item-sub">30mL · content_id: beauty_serum_001</p>
          <div class="item-qty-row">
            <div class="qty-control">
              <button disabled>－</button>
              <span>1</span>
              <button disabled>＋</button>
            </div>
            <span class="item-price">¥4,200</span>
          </div>
        </div>
      </div>
    </div>

    <!-- 注文サマリー -->
    <div class="summary-card">
      <p class="summary-title">ORDER SUMMARY</p>
      <div class="summary-row">
        <span>小計</span><span>¥4,200</span>
      </div>
      <div class="summary-row">
        <span>送料</span><span>無料</span>
      </div>
      <div class="summary-row">
        <span>消費税（10%）</span><span>含む</span>
      </div>
      <div class="summary-row total">
        <span>合計</span>
        <span class="total-price">¥4,200</span>
      </div>
    </div>

    <!-- 購入手続きへボタン (イベント発火なし) -->
    <button id="checkout-button" class="btn-checkout">購入手続きへ</button>
    <button id="back-to-shop-button" class="btn-back" onclick="window.location.href='index.html'">← お買い物を続ける</button>

    <div class="security-note">
      🔒 SSL暗号化による安全な通信
    </div>
  </main>

  <footer>© 2025 LUMIÈRE Beauty. All rights reserved.</footer>

  <script>
    // ページロード時イベント: view_cart
    window.dataLayer = window.dataLayer || [];
    dataLayer.push({
      event: "view_cart"
    });

    // 「購入手続きへ」ボタン — イベント発火なし、そのまま遷移
    document.getElementById("checkout-button").addEventListener("click", function () {
      window.location.href = "checkout.html";
    });
  </script>

</body>
</html>
